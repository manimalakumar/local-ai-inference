# Configure Python packaging and test discovery for the clinical trial MVP.

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-clinical-trial-mvp4"
version = "0.5.0"
description = "Clinical Text-to-SQL inference optimization with Qwen and Nemotron."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
