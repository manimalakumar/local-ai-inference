name: CPU tests and recorded replay
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      MPLCONFIGDIR: /tmp/local-ai-lab-mpl
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: constraints/cpu-notebook-py311.txt
      - run: python -m pip install -r requirements-notebook.txt -c constraints/cpu-notebook-py311.txt
      - run: python scripts/tutorial/validate_notebooks.py --check-only
      - run: python -m pytest -q
      - run: python scripts/tutorial/validate_notebooks.py --mode replay
      - run: python scripts/tutorial/validate_notebooks.py --mode plan
      - run: python scripts/tutorial/render_findings.py
      - run: python scripts/tutorial/analyze_output_tokens.py
      - run: python scripts/tutorial/build_sql_review_packet.py
      - run: git diff --exit-code -- tutorial/figures/figure_data.json tutorial/output_token_analysis.json tutorial/sql_review_distinct.json tutorial/SQL_REVIEW_DISTINCT.md
      - run: git diff --check
